# systemd serves the Pi's hardware watchdog: if the system hangs, the
# watchdog resets the Pi. A trial of new firmware settings needs it, so a
# trial that hangs resets back onto config.txt by itself. Installed to
# /etc/systemd/system.conf.d/watchdog.conf by hand (README.md).
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
