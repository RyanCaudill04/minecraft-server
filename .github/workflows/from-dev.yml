# Changes reach main only through dev: a PR into main passes the from-dev
# check only when it comes from this repo's dev branch. The Main ruleset
# requires the check.
#
# pull_request_target runs this file as it is on main, so a PR can't
# change or remove the check. It's safe here because the job never checks
# out or runs the PR's code and has no permissions or secrets.
name: From dev

on:
  pull_request_target:
    branches: [main]
    # edited: the PR's base branch changed.
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  from-dev:
    name: from-dev
    runs-on: ubuntu-latest
    steps:
      - name: The PR comes from this repo's dev branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != dev ] || [ "$HEAD_REPO" != "$REPO" ]; then
            echo "::error::PRs into main must come from dev. Open this PR into dev, then merge dev into main."
            exit 1
          fi
          echo "From $REPO dev"
