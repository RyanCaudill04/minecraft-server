# CI/CD for the whole repo.
#
# Pull requests: work out which parts changed, run the checks for those
# parts, and report one required check, ci-ok.
# Pushes to main: the same checks for everything since the last release,
# then publish a release if any of it is deployable. The Pi's mc-agent
# timer installs the newest release.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main don't
# cancel the running one, but GitHub keeps only one pending run per group,
# so a newer merge replaces a waiting one. That's fine: each run on main
# covers everything since the last release, so main always catches up.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      play: ${{ steps.scopes.outputs.play }}
      admin: ${{ steps.scopes.outputs.admin }}
      mc_server: ${{ steps.scopes.outputs.mc_server }}
      infra: ${{ steps.scopes.outputs.infra }}
      deploy: ${{ steps.scopes.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed scopes
        id: scopes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Without pipefail, a failing ci-changes.sh is hidden by tee.
          set -o pipefail
          # By default git quotes paths with non-ASCII characters, which
          # ci-changes.sh's patterns would never match.
          git config core.quotePath false
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$(git merge-base "origin/$BASE_REF" HEAD)" HEAD)
          elif [ "$EVENT" = push ]; then
            # Diff against the newest release, not the previous push, so
            # changes from a cancelled or failed run are picked up by the
            # next one.
            last=$(git tag -l 'r[0-9]*' --sort=-v:refname | grep -Ex -m1 'r[0-9]+' || true)
            if [ -n "$last" ] && git merge-base --is-ancestor "$last" HEAD; then
              echo "Comparing with $last"
              files=$(git diff --name-only "$last" HEAD)
            elif [ -n "$last" ] && git merge-base --is-ancestor HEAD "$last"; then
              # A re-run of a commit that a newer release already includes.
              echo "Already released in $last"
              files=
            else
              # No release yet, or history was rewritten.
              files=$(git ls-files)
            fi
          else
            # Manual runs: check everything.
            files=$(git ls-files)
          fi
          echo "Changed files:"
          echo "$files"
          echo "$files" | scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  go:
    name: go (vet, test, build, smoke tests)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/go.mod
          cache: false
      - name: gofmt
        working-directory: web
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::run gofmt -w"; exit 1; }
      - name: vet
        working-directory: web
        run: go vet ./...
      - name: test
        working-directory: web
        run: go test -race ./...
      - name: build for each release architecture
        working-directory: web
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build ./...
          done

      # The site checks share this job's checkout and Go toolchain rather
      # than paying for their own runners, and run only when their scope
      # changed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.play == 'true' || needs.changes.outputs.admin == 'true'
        with:
          node-version: 24
      - name: play.ryancaudill.dev JavaScript syntax
        if: needs.changes.outputs.play == 'true'
        run: node --check sites/play/app.js && node --check sites/play/format.js
      - name: play.ryancaudill.dev unit tests for the page's helpers
        if: needs.changes.outputs.play == 'true'
        # Number and date formats follow the locale and zone; the tests expect these.
        env:
          LC_ALL: en_US.UTF-8
          TZ: UTC
        run: node --test tests/play/format.test.js
      - name: play.ryancaudill.dev smoke test
        if: needs.changes.outputs.play == 'true'
        run: |
          (cd web && go build -o "$RUNNER_TEMP/play" ./cmd/play)
          mkdir -p "$RUNNER_TEMP/server"
          # Nothing listens on these ports, so the server reads as offline.
          "$RUNNER_TEMP/play" -dir sites/play -shared sites/shared -server "$RUNNER_TEMP/server" \
            -addr 127.0.0.1:8082 -paper 127.0.0.1:1 -lazymc 127.0.0.1:2 &
          for _ in $(seq 50); do curl -fs http://127.0.0.1:8082/ >/dev/null && break; sleep 0.1; done
          curl -fsS http://127.0.0.1:8082/ | grep -q '<title>play.ryancaudill.dev</title>'
          for asset in /shared/base.css style.css app.js format.js; do
            grep -q "$asset" sites/play/index.html sites/play/app.js
            curl -fsS -o /dev/null "http://127.0.0.1:8082/${asset#/}"
          done
          curl -fsS http://127.0.0.1:8082/api/status | grep -q '"state":"offline"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/api/world)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8082/api/status)" = 405
      - name: admin.ryancaudill.dev JavaScript syntax
        if: needs.changes.outputs.admin == 'true'
        run: node --check sites/admin/app.js
      - name: admin.ryancaudill.dev smoke test
        if: needs.changes.outputs.admin == 'true'
        run: |
          (cd web && go build -o "$RUNNER_TEMP/admin" ./cmd/admin)
          apps=$(mktemp -d)
          # Without the Access config, admin stays up for the health check
          # but refuses everything else.
          env -u ACCESS_TEAM_DOMAIN -u ACCESS_AUD \
            "$RUNNER_TEMP/admin" -dir sites/admin -shared sites/shared -apps "$apps" -addr 127.0.0.1:8084 &
          for _ in $(seq 50); do curl -fs http://127.0.0.1:8084/healthz >/dev/null && break; sleep 0.1; done
          curl -fsS http://127.0.0.1:8084/healthz | grep -q ok
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8084/api/status)" = 503
          # With it, requests without a token get 403, except the health check.
          ACCESS_TEAM_DOMAIN=ci.cloudflareaccess.com ACCESS_AUD=ci \
            "$RUNNER_TEMP/admin" -dir sites/admin -shared sites/shared -apps "$apps" -addr 127.0.0.1:8083 &
          for _ in $(seq 50); do curl -fs http://127.0.0.1:8083/healthz >/dev/null && break; sleep 0.1; done
          curl -fsS http://127.0.0.1:8083/healthz | grep -q ok
          for path in / /api/status /api/deploy; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8083$path")" = 403
          done
          # The rest runs as a dev user. Nothing listens on these ports, so
          # the server reads as offline.
          "$RUNNER_TEMP/admin" -dir sites/admin -shared sites/shared -apps "$apps" \
            -addr 127.0.0.1:8081 -paper 127.0.0.1:1 -lazymc 127.0.0.1:2 -dev-user ci@example.com &
          for _ in $(seq 50); do curl -fs http://127.0.0.1:8081/ >/dev/null && break; sleep 0.1; done
          curl -fsS http://127.0.0.1:8081/ | grep -q '<title>admin.ryancaudill.dev</title>'
          for asset in /shared/base.css style.css app.js; do
            grep -q "$asset" sites/admin/index.html
            curl -fsS -o /dev/null "http://127.0.0.1:8081/${asset#/}"
          done
          curl -fsS http://127.0.0.1:8081/api/status | grep -q '"state":"offline"'
          curl -fsS http://127.0.0.1:8081/api/deploy | grep -q '"active":""'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8081/api/status)" = 405
      - name: static sites smoke test
        if: needs.changes.outputs.admin == 'true'
        run: |
          (cd web && go build -o "$RUNNER_TEMP/serve" ./cmd/serve)
          for site in portfolio; do
            port=$(sed -n 's/^ADDR=127\.0\.0\.1:\([0-9]*\)$/\1/p' "deploy/sites/$site.env")
            test -n "$port" || { echo "::error::deploy/sites/$site.env must bind to 127.0.0.1"; exit 1; }
            "$RUNNER_TEMP/serve" -dir "sites/$site" -addr "127.0.0.1:$port" &
            for _ in $(seq 50); do curl -fs "http://127.0.0.1:$port/" >/dev/null && break; sleep 0.1; done
            curl -fsS "http://127.0.0.1:$port/" | grep -q '<title>'
            echo "$site OK on $port"
          done

  play-e2e:
    name: play.ryancaudill.dev end-to-end
    needs: changes
    if: needs.changes.outputs.play == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/play/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Playwright and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Playwright tests
        # Starts the fixture server (TestFixtureServer in web/cmd/play) itself.
        run: npx playwright test
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-screenshots
          path: tests/play/e2e/screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-e2e-report
          path: |
            tests/play/e2e/playwright-report/
            tests/play/e2e/test-results/
          retention-days: 14

  mc-server:
    name: Minecraft server config
    needs: changes
    if: needs.changes.outputs.mc_server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck start.sh
        run: shellcheck start.sh
      - name: lazymc.toml
        run: |
          python3 - <<'EOF'
          import tomllib
          with open("lazymc.toml", "rb") as f:
              cfg = tomllib.load(f)
          # play pings Paper here to tell "active" from "sleeping".
          assert cfg["server"]["address"] == "127.0.0.1:25566", cfg["server"]["address"]
          assert cfg["public"]["address"].endswith(":25565"), cfg["public"]["address"]
          print("lazymc.toml OK")
          EOF
      - name: Pinned server files match deploy/server.json and plugins/manifest.json
        run: |
          # Until the jars are untracked, the tracked copies must be the
          # pinned ones. fetch-server.sh fails on any SHA-256 mismatch.
          tracked=$RUNNER_TEMP/tracked
          mkdir -p "$tracked"
          git ls-files -z server.jar 'plugins/*.jar' | xargs -0 cp --parents -t "$tracked"
          scripts/fetch-server.sh --arch arm64 "$tracked"
          for jar in $(git ls-files 'plugins/*.jar'); do
            jq -e --arg f "${jar#plugins/}" 'any(.plugins[]; .file == $f)' plugins/manifest.json >/dev/null ||
              { echo "::error::$jar is tracked but not pinned in plugins/manifest.json"; exit 1; }
          done
          # Every pinned URL still serves the pinned file.
          mkdir -p "$RUNNER_TEMP/fresh"
          scripts/fetch-server.sh --arch amd64 "$RUNNER_TEMP/fresh"
      - name: No secrets in tracked config
        run: |
          if git ls-files --error-unmatch server.properties >/dev/null 2>&1; then
            echo "::error::server.properties must stay untracked; edit server.properties.example"
            exit 1
          fi
          if grep -nE '^(management-server-secret|rcon\.password)=.+' server.properties.example; then
            echo "::error::server.properties.example must not contain secrets"
            exit 1
          fi

  paper-boot:
    name: Paper boot test
    needs: changes
    if: needs.changes.outputs.mc_server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Java version server.jar needs
        id: jar
        run: |
          java=$(unzip -p server.jar version.json | jq -er .java_version)
          echo "java=$java" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.jar.outputs.java }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/go.mod
          cache: false
      - name: Copy the server files to a scratch folder
        run: |
          server=$RUNNER_TEMP/server
          mkdir -p "$server"
          # The tracked server files, as on the Pi. versions/ and libraries/
          # are made by Paperclip below.
          cp -R server.jar start.sh eula.txt bukkit.yml spigot.yml commands.yml \
            ops.json whitelist.json banned-ips.json banned-players.json config plugins "$server/"
          cp server.properties.example "$server/server.properties"
          # Don't report CI runs as the Pi's server to bStats.
          sed -i 's/^enabled: true$/enabled: false/' "$server/plugins/bStats/config.yml"
          grep -qx 'enabled: false' "$server/plugins/bStats/config.yml"
      # Paperclip downloads the Mojang server jar into cache/ and patches it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/server/cache
          key: paperclip-${{ hashFiles('server.jar') }}
      - name: Install the Paper server files
        working-directory: ${{ runner.temp }}/server
        run: java -Dpaperclip.patchonly=true -jar server.jar
      - name: Boot Paper, ping it and stop it
        working-directory: ${{ runner.temp }}/server
        env:
          MC_HEAP: 2G
        run: |
          (cd "$GITHUB_WORKSPACE/web" && go build -o "$RUNNER_TEMP/mc-players" ./cmd/mc-players)
          mkfifo console
          ./start.sh <console >server.log 2>&1 &
          pid=$!
          exec 3>console
          trap 'kill "$pid" 2>/dev/null || true; echo "--- server.log"; cat server.log' EXIT

          echo "Waiting for Paper to start"
          for _ in $(seq 600); do
            grep -q 'Done ([0-9.]*s)! For help' server.log && break
            kill -0 "$pid" 2>/dev/null || { echo "::error::Paper exited during startup"; exit 1; }
            sleep 1
          done
          grep -q 'Done ([0-9.]*s)! For help' server.log || { echo "::error::Paper didn't finish starting"; exit 1; }

          # Every plugin jar in plugins/ must have been enabled.
          for jar in plugins/*.jar; do
            name=$({ unzip -p "$jar" paper-plugin.yml plugin.yml 2>/dev/null || true; } | sed -n 's/^name: *//p' | head -1 | tr -d "\"'\r")
            test -n "$name" || { echo "::error::$jar has no plugin name"; exit 1; }
            grep -q "\[$name\] Enabling $name" server.log || { echo "::error::plugin $name ($jar) was not enabled"; exit 1; }
            echo "$name enabled"
          done

          "$RUNNER_TEMP/mc-players" -addr 127.0.0.1:25566 | tee ping.txt
          grep -q '^0/[0-9]* online$' ping.txt

          echo stop >&3
          for _ in $(seq 120); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          if kill -0 "$pid" 2>/dev/null; then echo "::error::Paper didn't stop"; exit 1; fi
          wait "$pid" || { echo "::error::Paper exited with status $?"; exit 1; }

          if grep -E '^\[[0-9:]+ (ERROR|FATAL)\]' server.log; then
            echo "::error::Paper logged errors"
            exit 1
          fi
          echo "Paper booted, answered a ping and stopped cleanly"

  infra:
    name: deploy files, scripts and workflows
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/go.mod
          cache: false
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: shellcheck scripts
        run: shellcheck scripts/*.sh
      - name: Change detection tests
        run: scripts/ci-changes_test.sh
      - name: Release notes tests
        run: scripts/release-notes_test.sh
      - name: Server fetch and migration tests
        run: |
          scripts/fetch-server_test.sh
          scripts/migrate-server-dir_test.sh
      - name: Build a release and verify its units
        run: |
          scripts/build-release.sh ci-check "$RUNNER_TEMP/dist"
          (cd "$RUNNER_TEMP/dist" && sha256sum -c ./*.sha256)
          # Agents that only know release.tar.gz must keep getting arm64.
          cmp "$RUNNER_TEMP/dist/release.tar.gz" "$RUNNER_TEMP/dist/release-linux-arm64.tar.gz"
          # Unpack the runner's build where the units expect it
          # (%h/apps/current) and let systemd check them, including that
          # every program exists and runs here.
          current="$HOME/apps/current"
          mkdir -p "$current" "$HOME/minecraft_server"
          tar -xzf "$RUNNER_TEMP/dist/release-linux-amd64.tar.gz" -C "$current"
          "$current/bin/mc-agent" version | grep -qx ci-check
          units=$(mktemp -d)
          cp "$current"/deploy/systemd/{play.service,admin.service,mc-agent.service,mc-agent.timer} "$units/"
          for site in portfolio; do cp "$current/deploy/systemd/site@.service" "$units/site@$site.service"; done
          systemd-analyze --user --man=no verify "$units"/*
          # Every unit, service and timer the manifest names must be in the
          # release, and the health checks must hit the ports the services
          # listen on. Otherwise a typo only shows up as a failed deploy.
          python3 - "$current" <<'EOF'
          import json, os, re, sys
          root = sys.argv[1]
          m = json.load(open(os.path.join(root, "deploy/release.json")))
          for unit in m["units"]:
              assert os.path.exists(os.path.join(root, "deploy/systemd", unit)), unit
          for svc in m["services"]:
              template = svc.split("@")[0] + "@.service" if "@" in svc else svc
              assert template in m["units"], f"{svc} is not linked by units"
          for timer in m["timers"]:
              assert timer in m["units"], f"{timer} is not linked by units"
          # site@<name>.service takes its address from deploy/sites/<name>.env;
          # the others pass -addr on their ExecStart line.
          ports = {}
          for svc in m["services"]:
              if "@" in svc:
                  name = svc.split("@")[1].removesuffix(".service")
                  path, pattern = f"deploy/sites/{name}.env", r"^ADDR=127\.0\.0\.1:(\d+)$"
              else:
                  path, pattern = f"deploy/systemd/{svc}", r"-addr 127\.0\.0\.1:(\d+)"
              found = re.search(pattern, open(os.path.join(root, path)).read(), re.M)
              assert found, f"{path} has no 127.0.0.1 address"
              ports[svc] = int(found.group(1))
          health = set()
          for url in m["health"]:
              found = re.match(r"http://127\.0\.0\.1:(\d+)/", url)
              assert found, f"health check {url} is not on 127.0.0.1"
              health.add(int(found.group(1)))
          assert health == set(ports.values()), f"health ports {sorted(health)} != service ports {ports}"
          print("release.json OK")
          EOF

  # The one check branch protection requires. Scoped jobs that were skipped
  # because nothing in their scope changed count as passing.
  ci-ok:
    name: ci-ok
    needs: [changes, go, play-e2e, mc-server, paper-boot, infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
          test "$(echo "$RESULTS" | jq -r '.changes.result')" = success

  release:
    name: release
    needs: [changes, ci-ok]
    # An `if` without a status function gets an implicit success(), which
    # is false when any job upstream was skipped, so release would be
    # skipped even after ci-ok passed. !cancelled() replaces it, and the
    # explicit ci-ok check still blocks a release when CI failed.
    if: >-
      !cancelled() &&
      needs.ci-ok.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.changes.outputs.deploy == 'true'))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # create the release and its tag
      pull-requests: read # get info for release notes from PRs in release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # read merged PRs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/go.mod
          cache: false
      - name: Next release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release list --limit 200 --json tagName \
            --jq '[.[].tagName | select(test("^r[0-9]+$")) | ltrimstr("r") | tonumber] | max // 0')
          echo "tag=r$((last + 1))" | tee -a "$GITHUB_OUTPUT"
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Without pipefail, a failing release-changes.sh is hidden.
          set -o pipefail
          scripts/release-changes.sh | scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.json"
          cat "$RUNNER_TEMP/notes.json"
      - name: Build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/build-release.sh "$TAG" dist "$RUNNER_TEMP/notes.json"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Built from ${GITHUB_SHA} by run ${GITHUB_RUN_ID}. The Pi installs it within a few minutes."
