# CI/CD for the whole repo.
#
# Pull requests: work out which parts changed, run the checks for those
# parts, and report one required check, ci-ok.
# Pushes to main: the same checks for everything since the last release,
# then publish a release of each track (play, admin, sites, agent) whose
# files changed since that track's last release, plus the single release
# (rN, everything in one archive) for agents from before tracks. The Pi's
# mc-agent timer installs each track's newest release.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main don't
# cancel the running one, but GitHub keeps only one pending run per group,
# so a newer merge replaces a waiting one. That's fine: each run on main
# covers everything since the last release, so main always catches up.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      play: ${{ steps.scopes.outputs.play }}
      admin: ${{ steps.scopes.outputs.admin }}
      sites: ${{ steps.scopes.outputs.sites }}
      agent: ${{ steps.scopes.outputs.agent }}
      mc_server: ${{ steps.scopes.outputs.mc_server }}
      infra: ${{ steps.scopes.outputs.infra }}
      deploy: ${{ steps.scopes.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed scopes
        id: scopes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Without pipefail, a failing ci-changes.sh is hidden by tee.
          set -o pipefail
          # By default git quotes paths with non-ASCII characters, which
          # ci-changes.sh's patterns would never match.
          git config core.quotePath false
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$(git merge-base "origin/$BASE_REF" HEAD)" HEAD)
          elif [ "$EVENT" = push ]; then
            # Diff against the newest release, not the previous push, so
            # changes from a cancelled or failed run are picked up by the
            # next one.
            last=$(git tag -l 'r[0-9]*' --sort=-v:refname | grep -Ex -m1 'r[0-9]+' || true)
            if [ -n "$last" ] && git merge-base --is-ancestor "$last" HEAD; then
              echo "Comparing with $last"
              files=$(git diff --name-only "$last" HEAD)
            elif [ -n "$last" ] && git merge-base --is-ancestor HEAD "$last"; then
              # A re-run of a commit that a newer release already includes.
              echo "Already released in $last"
              files=
            else
              # No release yet, or history was rewritten.
              files=$(git ls-files)
            fi
          else
            # Manual runs: check everything.
            files=$(git ls-files)
          fi
          echo "Changed files:"
          echo "$files"
          echo "$files" | scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  go:
    name: go (vet, test, build)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/go.mod
          cache: false
      - name: gofmt
        working-directory: web
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::run gofmt -w"; exit 1; }
      - name: vet
        working-directory: web
        run: go vet ./...
      - name: test
        working-directory: web
        run: go test -race ./...
      - name: build for the Pi
        working-directory: web
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...

  play:
    name: play.ryancaudill.dev
    needs: changes
    if: needs.changes.outputs.play == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/go.mod
          cache: false
      - name: JavaScript syntax
        run: node --check sites/play/app.js
      - name: Smoke test the built server
        run: |
          (cd web && go build -o "$RUNNER_TEMP/play" ./cmd/play)
          mkdir -p "$RUNNER_TEMP/server"
          # Nothing listens on these ports, so the server reads as offline.
          "$RUNNER_TEMP/play" -dir sites/play -shared sites/shared -server "$RUNNER_TEMP/server" \
            -addr 127.0.0.1:8082 -paper 127.0.0.1:1 -lazymc 127.0.0.1:2 &
          for _ in $(seq 50); do curl -fs http://127.0.0.1:8082/ >/dev/null && break; sleep 0.1; done
          curl -fsS http://127.0.0.1:8082/ | grep -q '<title>play.ryancaudill.dev</title>'
          for asset in /shared/base.css style.css app.js; do
            grep -q "$asset" sites/play/index.html
            curl -fsS -o /dev/null "http://127.0.0.1:8082/${asset#/}"
          done
          curl -fsS http://127.0.0.1:8082/api/status | grep -q '"state":"offline"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/api/world)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8082/api/status)" = 405

  admin:
    name: admin.ryancaudill.dev and static sites
    needs: changes
    if: needs.changes.outputs.admin == 'true' || needs.changes.outputs.sites == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/go.mod
          cache: false
      - name: JavaScript syntax
        run: node --check sites/admin/app.js
      - name: Smoke test the admin server
        run: |
          (cd web && go build -o "$RUNNER_TEMP/admin" ./cmd/admin)
          apps=$(mktemp -d)
          # Nothing listens on these ports, so the server reads as offline.
          "$RUNNER_TEMP/admin" -dir sites/admin -shared sites/shared -apps "$apps" \
            -addr 127.0.0.1:8081 -paper 127.0.0.1:1 -lazymc 127.0.0.1:2 &
          for _ in $(seq 50); do curl -fs http://127.0.0.1:8081/ >/dev/null && break; sleep 0.1; done
          curl -fsS http://127.0.0.1:8081/ | grep -q '<title>admin.ryancaudill.dev</title>'
          for asset in /shared/base.css style.css app.js; do
            grep -q "$asset" sites/admin/index.html
            curl -fsS -o /dev/null "http://127.0.0.1:8081/${asset#/}"
          done
          curl -fsS http://127.0.0.1:8081/api/status | grep -q '"state":"offline"'
          curl -fsS http://127.0.0.1:8081/api/deploy | grep -q '"active":""'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8081/api/status)" = 405
      - name: Smoke test each static site
        run: |
          (cd web && go build -o "$RUNNER_TEMP/serve" ./cmd/serve)
          for site in portfolio; do
            port=$(sed -n 's/^ADDR=127\.0\.0\.1:\([0-9]*\)$/\1/p' "deploy/sites/$site.env")
            test -n "$port" || { echo "::error::deploy/sites/$site.env must bind to 127.0.0.1"; exit 1; }
            "$RUNNER_TEMP/serve" -dir "sites/$site" -addr "127.0.0.1:$port" &
            for _ in $(seq 50); do curl -fs "http://127.0.0.1:$port/" >/dev/null && break; sleep 0.1; done
            curl -fsS "http://127.0.0.1:$port/" | grep -q '<title>'
            echo "$site OK on $port"
          done

  mc-server:
    name: Minecraft server config
    needs: changes
    if: needs.changes.outputs.mc_server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck start.sh
        run: shellcheck start.sh
      - name: lazymc.toml
        run: |
          python3 - <<'EOF'
          import tomllib
          with open("lazymc.toml", "rb") as f:
              cfg = tomllib.load(f)
          # play pings Paper here to tell "active" from "sleeping".
          assert cfg["server"]["address"] == "127.0.0.1:25566", cfg["server"]["address"]
          assert cfg["public"]["address"].endswith(":25565"), cfg["public"]["address"]
          print("lazymc.toml OK")
          EOF
      - name: No secrets in tracked config
        run: |
          if git ls-files --error-unmatch server.properties >/dev/null 2>&1; then
            echo "::error::server.properties must stay untracked; edit server.properties.example"
            exit 1
          fi
          if grep -nE '^(management-server-secret|rcon\.password)=.+' server.properties.example; then
            echo "::error::server.properties.example must not contain secrets"
            exit 1
          fi

  infra:
    name: deploy files, scripts and workflows
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/go.mod
          cache: false
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: shellcheck scripts
        run: shellcheck scripts/*.sh
      - name: Change detection tests
        run: scripts/ci-changes_test.sh
      - name: Release notes tests
        run: scripts/release-notes_test.sh
      - name: Release tracks tests
        run: scripts/release-tracks_test.sh
      - name: Build each track's release and the single release, and verify their units
        run: |
          mkdir -p "$HOME/minecraft_server"
          for track in $(jq -r 'keys_unsorted[]' deploy/tracks.json) single; do
            if [ "$track" = single ]; then
              archive=release.tar.gz root="$HOME/apps/current"
            else
              archive=$track-linux-arm64.tar.gz root="$HOME/apps/$track/current"
            fi
            echo "::group::$track"
            scripts/build-release.sh "$track" ci-check "$RUNNER_TEMP/dist/$track"
            (cd "$RUNNER_TEMP/dist/$track" && sha256sum -c "$archive.sha256")
            # Unpack where the units expect it and let systemd check them,
            # including that every program exists.
            mkdir -p "$root"
            tar -xzf "$RUNNER_TEMP/dist/$track/$archive" -C "$root"
            units=$(mktemp -d)
            # Every unit and service the manifest names must be in the
            # release; copy each, with template instances under their own name.
            python3 - "$root" "$units" "$track" <<'EOF'
          import json, os, shutil, sys
          root, units, track = sys.argv[1:]
          m = json.load(open(os.path.join(root, "deploy/release.json")))
          assert m.get("track", "single") == track, f"release.json is for {m.get('track')}"
          def template(name):
              base, at, rest = name.partition("@")
              return base + "@." + rest.rsplit(".", 1)[1] if at else name
          for unit in m["units"]:
              assert os.path.exists(os.path.join(root, "deploy/systemd", unit)), unit
              if "@." not in unit:
                  shutil.copy(os.path.join(root, "deploy/systemd", unit), units)
          for name in m["services"] + m["timers"]:
              assert template(name) in m["units"], f"{name} is not linked by units"
              if name != template(name):
                  shutil.copy(os.path.join(root, "deploy/systemd", template(name)), os.path.join(units, name))
          print(f"{track}: release.json OK")
          EOF
            systemd-analyze --user --man=no verify "$units"/*
            echo "::endgroup::"
          done

  # The one check branch protection requires. Scoped jobs that were skipped
  # because nothing in their scope changed count as passing.
  ci-ok:
    name: ci-ok
    needs: [changes, go, play, admin, mc-server, infra]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
          test "$(echo "$RESULTS" | jq -r '.changes.result')" = success

  release:
    name: release
    needs: [changes, ci-ok]
    # Without a status function, actions would add a silent success()
    # success() fails on skipped jobs, so release would get skipped on a ci-ok success
    if: >-
      !cancelled() &&
      needs.ci-ok.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.changes.outputs.deploy == 'true'))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # create the release and its tag
      pull-requests: read # get info for release notes from PRs in release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # read merged PRs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/go.mod
          cache: false
      # Before the single release, so an agent that moves the Pi to tracks
      # finds every track's release when it first runs.
      - name: Publish each changed track
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Without pipefail, a failing release-changes.sh is hidden.
          set -o pipefail
          scripts/release-tracks.sh | tee "$RUNNER_TEMP/tracks.txt"
          # Read from fd 3, so nothing in the loop eats the list.
          while read -r track tag base <&3; do
            [ "$base" = - ] && base=
            echo "::group::$tag"
            scripts/release-changes.sh "$base" | scripts/release-notes.sh "$tag" > "$RUNNER_TEMP/$track-notes.json"
            cat "$RUNNER_TEMP/$track-notes.json"
            scripts/build-release.sh "$track" "$tag" "dist/$track" "$RUNNER_TEMP/$track-notes.json"
            archive="dist/$track/$track-linux-arm64.tar.gz"
            # Not "Latest": that stays the single release, which is all
            # agents from before tracks look at. Newer agents find each
            # track's newest release by its tag.
            gh release create "$tag" "$archive" "$archive.sha256" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --latest=false \
              --notes "The $track track, built from ${GITHUB_SHA} by run ${GITHUB_RUN_ID}. The Pi installs it within a few minutes."
            echo "::endgroup::"
          done 3< "$RUNNER_TEMP/tracks.txt"
      - name: Next single release tag
        id: tag
        run: |
          # From the tags, so the count doesn't depend on how many track
          # releases came in between.
          last=$(git tag -l 'r[0-9]*' | sed -n 's/^r\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n1)
          echo "tag=r$((${last:-0} + 1))" | tee -a "$GITHUB_OUTPUT"
      - name: Single release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Without pipefail, a failing release-changes.sh is hidden.
          set -o pipefail
          scripts/release-changes.sh | scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.json"
          cat "$RUNNER_TEMP/notes.json"
      - name: Build the single release
        run: scripts/build-release.sh single "${{ steps.tag.outputs.tag }}" dist/single "$RUNNER_TEMP/notes.json"
      - name: Publish the single release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" dist/single/release.tar.gz dist/single/release.tar.gz.sha256 \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --latest \
            --notes "Everything in one release, for agents from before tracks. Built from ${GITHUB_SHA} by run ${GITHUB_RUN_ID}."
