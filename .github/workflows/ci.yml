# CI/CD for the whole repo.
#
# Pull requests: work out which parts changed, run the checks for those
# parts, and report one required check, ci-ok.
# Pushes to main: the same checks for everything since the last release,
# then push the play, admin and mc-server images to GHCR and publish a
# release that pins them, if any of it is deployable. The Pi's mc-agent
# timer installs the newest release.
# Pushes to dev: the same checks, then deploy the dev sites to Cloudflare
# (dev/): play's and admin's pages with a synthetic API snapshot.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request or to dev cancels its older run. Runs on
# main don't cancel the running one, but GitHub keeps only one pending run
# per group, so a newer merge replaces a waiting one. That's fine: each run
# on main covers everything since the last release, so main always catches
# up.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      play: ${{ steps.scopes.outputs.play }}
      admin: ${{ steps.scopes.outputs.admin }}
      mc_server: ${{ steps.scopes.outputs.mc_server }}
      infra: ${{ steps.scopes.outputs.infra }}
      images: ${{ steps.scopes.outputs.images }}
      deploy: ${{ steps.scopes.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed scopes
        id: scopes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Without pipefail, a failing ci-changes.sh is hidden by tee.
          set -o pipefail
          # By default git quotes paths with non-ASCII characters, which
          # ci-changes.sh's patterns would never match.
          git config core.quotePath false
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$(git merge-base "origin/$BASE_REF" HEAD)" HEAD)
          elif [ "$EVENT" = push ]; then
            # Diff against the newest release, not the previous push, so
            # changes from a cancelled or failed run are picked up by the
            # next one.
            last=$(git tag -l 'r[0-9]*' --sort=-v:refname | grep -Ex -m1 'r[0-9]+' || true)
            if [ -n "$last" ] && git merge-base --is-ancestor "$last" HEAD; then
              echo "Comparing with $last"
              files=$(git diff --name-only "$last" HEAD)
            elif [ -n "$last" ] && git merge-base --is-ancestor HEAD "$last"; then
              # A re-run of a commit that a newer release already includes.
              echo "Already released in $last"
              files=
            else
              # No release yet, or history was rewritten.
              files=$(git ls-files)
            fi
          else
            # Manual runs: check everything.
            files=$(git ls-files)
          fi
          echo "Changed files:"
          echo "$files"
          echo "$files" | scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  go:
    name: go (vet, test, build, smoke tests)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/go.mod
          cache: false
      - name: gofmt
        working-directory: web
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::run gofmt -w"; exit 1; }
      - name: vet
        working-directory: web
        run: go vet ./...
      - name: test
        working-directory: web
        run: go test -race ./...
      - name: build for the Pi
        working-directory: web
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...

      # The site checks share this job's checkout and Go toolchain rather
      # than paying for their own runners, and run only when their scope
      # changed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.play == 'true' || needs.changes.outputs.admin == 'true' || needs.changes.outputs.infra == 'true'
        with:
          node-version: 24
      - name: dev sites build, and their Worker's tests
        # A page that starts reading a new API route needs a snapshot of it
        # for the dev site, so this runs when either page changes too.
        if: needs.changes.outputs.play == 'true' || needs.changes.outputs.admin == 'true' || needs.changes.outputs.infra == 'true'
        run: |
          node --test tests/dev/worker.test.mjs
          scripts/build-dev_test.sh
      - name: play.ryancaudill.dev JavaScript syntax
        if: needs.changes.outputs.play == 'true'
        run: node --check sites/play/app.js && node --check sites/play/format.js
      - name: play.ryancaudill.dev unit tests for the page's helpers
        if: needs.changes.outputs.play == 'true'
        # Number and date formats follow the locale and zone; the tests expect these.
        env:
          LC_ALL: en_US.UTF-8
          TZ: UTC
        run: node --test tests/play/format.test.js
      - name: play.ryancaudill.dev smoke test
        if: needs.changes.outputs.play == 'true'
        run: |
          (cd web && go build -o "$RUNNER_TEMP/play" ./cmd/play)
          mkdir -p "$RUNNER_TEMP/server"
          # Nothing listens on these ports, so the server reads as offline.
          "$RUNNER_TEMP/play" -dir sites/play -shared sites/shared -server "$RUNNER_TEMP/server" \
            -addr 127.0.0.1:8082 -paper 127.0.0.1:1 -lazymc 127.0.0.1:2 &
          for _ in $(seq 50); do curl -fs http://127.0.0.1:8082/ >/dev/null && break; sleep 0.1; done
          curl -fsS http://127.0.0.1:8082/ | grep -q '<title>play.ryancaudill.dev</title>'
          for asset in /shared/base.css style.css app.js format.js; do
            grep -q "$asset" sites/play/index.html sites/play/app.js
            curl -fsS -o /dev/null "http://127.0.0.1:8082/${asset#/}"
          done
          curl -fsS http://127.0.0.1:8082/api/status | grep -q '"state":"offline"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/api/world)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8082/api/status)" = 405
      - name: admin.ryancaudill.dev JavaScript syntax
        if: needs.changes.outputs.admin == 'true'
        run: node --check sites/admin/app.js && node --check sites/admin/status.js
      - name: admin.ryancaudill.dev unit tests for the page's helpers
        if: needs.changes.outputs.admin == 'true'
        run: node --test tests/admin/status.test.js
      - name: admin.ryancaudill.dev smoke test
        if: needs.changes.outputs.admin == 'true'
        run: |
          (cd web && go build -o "$RUNNER_TEMP/admin" ./cmd/admin)
          apps=$(mktemp -d)
          # Without the Access config, admin stays up for the health check
          # but refuses everything else.
          env -u ACCESS_TEAM_DOMAIN -u ACCESS_AUD \
            "$RUNNER_TEMP/admin" -dir sites/admin -shared sites/shared -apps "$apps" -addr 127.0.0.1:8084 &
          for _ in $(seq 50); do curl -fs http://127.0.0.1:8084/healthz >/dev/null && break; sleep 0.1; done
          curl -fsS http://127.0.0.1:8084/healthz | grep -q ok
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8084/api/status)" = 503
          # With it, requests without a token get 403, except the health check.
          ACCESS_TEAM_DOMAIN=ci.cloudflareaccess.com ACCESS_AUD=ci \
            "$RUNNER_TEMP/admin" -dir sites/admin -shared sites/shared -apps "$apps" -addr 127.0.0.1:8083 &
          for _ in $(seq 50); do curl -fs http://127.0.0.1:8083/healthz >/dev/null && break; sleep 0.1; done
          curl -fsS http://127.0.0.1:8083/healthz | grep -q ok
          for path in / /api/status /api/deploy; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8083$path")" = 403
          done
          # The rest runs as a dev user. Nothing listens on these ports, so
          # the server reads as offline.
          "$RUNNER_TEMP/admin" -dir sites/admin -shared sites/shared -apps "$apps" \
            -addr 127.0.0.1:8081 -paper 127.0.0.1:1 -lazymc 127.0.0.1:2 -dev-user ci@example.com &
          for _ in $(seq 50); do curl -fs http://127.0.0.1:8081/ >/dev/null && break; sleep 0.1; done
          curl -fsS http://127.0.0.1:8081/ | grep -q '<title>admin.ryancaudill.dev</title>'
          for asset in /shared/base.css style.css app.js status.js; do
            grep -q "$asset" sites/admin/index.html sites/admin/app.js
            curl -fsS -o /dev/null "http://127.0.0.1:8081/${asset#/}"
          done
          curl -fsS http://127.0.0.1:8081/api/status | grep -q '"state":"offline"'
          curl -fsS http://127.0.0.1:8081/api/deploy | grep -q '"active":""'
          # Off a Pi 5, with no owner set, the Pi settings are read-only.
          curl -fsS http://127.0.0.1:8081/api/pi | grep -q '"can_change":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8081/api/status)" = 405
  play-e2e:
    name: play.ryancaudill.dev end-to-end
    needs: changes
    if: needs.changes.outputs.play == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/play/e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Playwright and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Playwright tests
        # Starts the fixture server (TestFixtureServer in web/cmd/play) itself.
        run: npx playwright test
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-screenshots
          path: tests/play/e2e/screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload the report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-e2e-report
          path: |
            tests/play/e2e/playwright-report/
            tests/play/e2e/test-results/
          retention-days: 14

  mc-server:
    name: Minecraft server config
    needs: changes
    if: needs.changes.outputs.mc_server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck the container's scripts
        run: shellcheck deploy/containers/mc-server/*.sh
      - name: lazymc.toml
        run: |
          python3 - <<'EOF'
          import tomllib
          with open("deploy/containers/mc-server/lazymc.toml", "rb") as f:
              cfg = tomllib.load(f)
          # play pings Paper here to tell "active" from "sleeping".
          assert cfg["server"]["address"] == "127.0.0.1:25566", cfg["server"]["address"]
          assert cfg["public"]["address"].endswith(":25565"), cfg["public"]["address"]
          # Where compose.yaml mounts the server folder, and where the
          # Dockerfile puts start.sh.
          assert cfg["server"]["directory"] == "/server", cfg["server"]["directory"]
          assert cfg["server"]["command"] == "/opt/minecraft/start.sh", cfg["server"]["command"]
          print("lazymc.toml OK")
          EOF
      - name: Pinned server files match deploy/server.json and plugins/manifest.json
        run: |
          # Until the jars are untracked, the tracked copies must be the
          # pinned ones. fetch-server.sh fails on any SHA-256 mismatch.
          tracked=$RUNNER_TEMP/tracked
          mkdir -p "$tracked"
          git ls-files -z server.jar 'plugins/*.jar' | xargs -0 cp --parents -t "$tracked"
          scripts/fetch-server.sh --arch arm64 "$tracked"
          for jar in $(git ls-files 'plugins/*.jar'); do
            jq -e --arg f "${jar#plugins/}" 'any(.plugins[]; .file == $f)' plugins/manifest.json >/dev/null ||
              { echo "::error::$jar is tracked but not pinned in plugins/manifest.json"; exit 1; }
          done
          # Every pinned URL still serves the pinned file.
          mkdir -p "$RUNNER_TEMP/fresh"
          scripts/fetch-server.sh --arch amd64 "$RUNNER_TEMP/fresh"
      - name: No secrets in tracked config
        run: |
          if git ls-files --error-unmatch server.properties >/dev/null 2>&1; then
            echo "::error::server.properties must stay untracked; edit server.properties.example"
            exit 1
          fi
          if grep -nE '^(management-server-secret|rcon\.password)=.+' server.properties.example; then
            echo "::error::server.properties.example must not contain secrets"
            exit 1
          fi

  infra:
    name: deploy files, scripts and workflows
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/go.mod
          cache: false
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: shellcheck scripts
        run: shellcheck scripts/*.sh deploy/backup/*.sh deploy/containers/*.sh
      - name: dev sites' wrangler configs parse
        # wrangler.jsonc allows comments; strip them before parsing.
        run: |
          for f in dev/*.jsonc; do
            sed 's#^ *//.*##' "$f" | jq -e '.name and .assets.directory and (.workers_dev == false)' >/dev/null ||
              { echo "::error::$f"; exit 1; }
          done
      - name: Change detection tests
        run: scripts/ci-changes_test.sh
      - name: Release notes tests
        run: |
          scripts/release-notes_test.sh
          scripts/release-changes_test.sh
      - name: World backup tests
        run: scripts/mc-backup_test.sh
      - name: Container image tag and compose wrapper tests
        run: |
          scripts/images_test.sh
          scripts/stack_test.sh
      - name: Server fetch and migration tests
        run: |
          scripts/fetch-server_test.sh
          scripts/migrate-server-dir_test.sh
      - name: Build a release and verify its units
        run: |
          scripts/build-release.sh ci-check "$RUNNER_TEMP/dist"
          (cd "$RUNNER_TEMP/dist" && sha256sum -c release.tar.gz.sha256)
          # Unpack where the units expect it (%h/apps/current) and let
          # systemd check them, including that every program exists.
          current="$HOME/apps/current"
          mkdir -p "$current" "$HOME/minecraft_server"
          tar -xzf "$RUNNER_TEMP/dist/release.tar.gz" -C "$current"
          units=$(mktemp -d)
          cp "$current"/deploy/systemd/{mc-containers.service,mc-agent.service,mc-agent.timer,mc-backup.service,mc-backup.timer} "$units/"
          systemd-analyze --user --man=no verify "$units"/*
          # compose.yaml as stack.sh fills it in, for the ports below.
          mkdir -p "$HOME/minecraft_server"
          DOCKER_GID=0 "$current/deploy/containers/stack.sh" config --format json > "$RUNNER_TEMP/compose.json"
          # Every unit, service and timer the manifest names must be in the
          # release, and the health checks must hit the ports the containers
          # listen on. Otherwise a typo only shows up as a failed deploy.
          python3 - "$current" "$RUNNER_TEMP/compose.json" <<'EOF'
          import json, os, re, sys
          root = sys.argv[1]
          compose = json.load(open(sys.argv[2]))
          m = json.load(open(os.path.join(root, "deploy/release.json")))
          for unit in m["units"]:
              assert os.path.exists(os.path.join(root, "deploy/systemd", unit)), unit
          for svc in m["services"]:
              template = svc.split("@")[0] + "@.service" if "@" in svc else svc
              assert template in m["units"], f"{svc} is not linked by units"
          for timer in m["timers"]:
              assert timer in m["units"], f"{timer} is not linked by units"
          # play and admin pass -addr in their compose command.
          ports = {}
          for name in ("play", "admin"):
              cmd = compose["services"][name]["command"]
              addr = cmd[cmd.index("-addr") + 1]
              found = re.fullmatch(r"127\.0\.0\.1:(\d+)", addr)
              assert found, f"{name} listens on {addr}, not 127.0.0.1"
              ports[name] = int(found.group(1))
          for name, svc in compose["services"].items():
              assert svc.get("network_mode") == "host", f"{name} isn't on the host's network"
          images = dict(l.split("=", 1) for l in open(os.path.join(root, "deploy/images.env")).read().split())
          for key in ("PLAY_IMAGE", "ADMIN_IMAGE", "MC_SERVER_IMAGE"):
              assert images[key].startswith("ghcr.io/ryancaudill04/minecraft-server/"), images
          health = set()
          for url in m["health"]:
              found = re.match(r"http://127\.0\.0\.1:(\d+)/", url)
              assert found, f"health check {url} is not on 127.0.0.1"
              health.add(int(found.group(1)))
          assert health == set(ports.values()), f"health ports {sorted(health)} != service ports {ports}"
          print("release.json OK")
          EOF

  # Builds the three images for the Pi (arm64, on an arm64 runner) and runs
  # them the way the Pi does, through stack.sh and compose.yaml. Nothing is
  # pushed; release does that.
  images:
    name: container images
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build play, admin and mc-server
        run: |
          docker build -f deploy/containers/web/Dockerfile --target play -t ci/play:ci .
          docker build -f deploy/containers/web/Dockerfile --target admin -t ci/admin:ci .
          docker build -f deploy/containers/mc-server/Dockerfile -t ci/mc-server:ci .
      - name: Run them as the Pi does
        run: |
          # A release as mc-agent unpacks it, pinned to the images above.
          rel=$RUNNER_TEMP/release
          mkdir -p "$rel/deploy/containers"
          cp deploy/containers/compose.yaml deploy/containers/stack.sh "$rel/deploy/containers/"
          printf '%s\n' PLAY_IMAGE=ci/play:ci ADMIN_IMAGE=ci/admin:ci MC_SERVER_IMAGE=ci/mc-server:ci > "$rel/deploy/images.env"
          # A new server folder. Paper sleeps until someone joins, so this
          # checks LazyMC, not a world.
          srv=$RUNNER_TEMP/server
          mkdir -p "$srv"
          cp eula.txt "$srv/"
          cp server.properties.example "$srv/server.properties"
          export SERVER_DIR=$srv APPS_DIR=$RUNNER_TEMP/apps BACKUP_DIR=$RUNNER_TEMP/backups MC_HEAP=1G
          "$rel/deploy/containers/stack.sh" up
          for _ in $(seq 60); do curl -fs http://127.0.0.1:8082/api/status | grep -q '"state":"sleeping"' && break; sleep 1; done
          curl -fsS http://127.0.0.1:8082/api/status | grep -q '"state":"sleeping"' ||
            { docker logs mc-server; docker logs play; exit 1; }
          curl -fsS http://127.0.0.1:8082/ | grep -q '<title>play.ryancaudill.dev</title>'
          curl -fsS http://127.0.0.1:8081/healthz | grep -q ok
          # Without the Access config, admin refuses everything else.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/api/status)" = 503
          # The files LazyMC writes keep the runner's owner, not root.
          test "$(stat -c %u "$srv/server.properties")" = "$(id -u)"
          # The unit's stop leaves the Minecraft server running.
          "$rel/deploy/containers/stack.sh" stop-web
          test "$(docker inspect -f '{{.State.Running}}' mc-server)" = true
          test "$(docker inspect -f '{{.State.Running}}' play)" = false
          # A stop reaches LazyMC through the entrypoint, well within the
          # grace period.
          start=$(date +%s)
          "$rel/deploy/containers/stack.sh" down
          test $(($(date +%s) - start)) -lt 60

  # The one check branch protection requires. Scoped jobs that were skipped
  # because nothing in their scope changed count as passing.
  ci-ok:
    name: ci-ok
    needs: [changes, go, play-e2e, mc-server, infra, images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
          test "$(echo "$RESULTS" | jq -r '.changes.result')" = success

  release:
    name: release
    needs: [changes, ci-ok]
    # An `if` without a status function gets an implicit success(), which
    # is false when any job upstream was skipped, so release would be
    # skipped even after ci-ok passed. !cancelled() replaces it, and the
    # explicit ci-ok check still blocks a release when CI failed.
    if: >-
      !cancelled() &&
      needs.ci-ok.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && needs.changes.outputs.deploy == 'true'))
    # arm64, like the Pi, so the images build natively.
    runs-on: ubuntu-24.04-arm
    environment: production
    permissions:
      contents: write # create the release and its tag
      packages: write # push the images to GHCR
      pull-requests: read # get info for release notes from PRs in release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # read merged PRs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/go.mod
          cache: false
      - name: Next release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh release list --limit 200 --json tagName \
            --jq '[.[].tagName | select(test("^r[0-9]+$")) | ltrimstr("r") | tonumber] | max // 0')
          echo "tag=r$((last + 1))" | tee -a "$GITHUB_OUTPUT"
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Without pipefail, a failing release-changes.sh is hidden.
          set -o pipefail
          scripts/release-changes.sh | scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.json"
          cat "$RUNNER_TEMP/notes.json"
      - name: Push the images
        # Before the release exists: the Pi pulls them as soon as it does.
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          scripts/images.sh "$TAG" > "$RUNNER_TEMP/images.env"
          cat "$RUNNER_TEMP/images.env"
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/images.env"
          for target in play admin; do
            image=$PLAY_IMAGE
            [ "$target" = admin ] && image=$ADMIN_IMAGE
            docker build -f deploy/containers/web/Dockerfile --target "$target" \
              --build-arg VERSION="$TAG" -t "$image" .
            docker push "$image"
          done
          # mc-server's tag is a hash of its inputs, so it's only built when
          # they changed. Otherwise the release pins the image already there,
          # and the deploy doesn't restart the server.
          if docker manifest inspect "$MC_SERVER_IMAGE" >/dev/null 2>&1; then
            echo "$MC_SERVER_IMAGE is already pushed"
          else
            docker build -f deploy/containers/mc-server/Dockerfile -t "$MC_SERVER_IMAGE" .
            docker push "$MC_SERVER_IMAGE"
          fi
          docker logout ghcr.io
      - name: Build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: scripts/build-release.sh "$TAG" dist "$RUNNER_TEMP/notes.json"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" dist/release.tar.gz dist/release.tar.gz.sha256 \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Built from ${GITHUB_SHA} by run ${GITHUB_RUN_ID}. The Pi installs it within a few minutes."

  # Pushes to dev only. Needs the CLOUDFLARE_API_TOKEN and
  # CLOUDFLARE_ACCOUNT_ID secrets in the dev environment. Nothing here
  # touches the Pi or a release.
  dev:
    name: deploy the dev sites
    needs: [ci-ok]
    if: >-
      !cancelled() &&
      needs.ci-ok.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build
        run: scripts/build-dev.sh dev/dist
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for site in play admin; do
            npx --yes wrangler@4.151.2 deploy -c "dev/$site.jsonc"
          done
