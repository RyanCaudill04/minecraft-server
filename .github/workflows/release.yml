# Publishes a release on every push to main. The Pi's mc-agent timer picks
# up the newest release, installs it, and rolls back if it fails.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Release one push at a time, in order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and its tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: web/go.mod
          cache: false

      - name: Vet and test
        working-directory: web
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt needed"; exit 1; }
          go vet ./...
          go test -race ./...

      - name: Build
        run: scripts/build-release.sh "r${GITHUB_RUN_NUMBER}" dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "r${GITHUB_RUN_NUMBER}" \
            dist/release.tar.gz dist/release.tar.gz.sha256 \
            --target "$GITHUB_SHA" \
            --title "r${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_SHA} by run ${GITHUB_RUN_ID}."
